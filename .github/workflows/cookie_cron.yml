name: Premium 10-Min Cookie Fetcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Show Current Time
        run: |
          echo "UTC Time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "BDT Time: $(TZ='Asia/Dhaka' date '+%Y-%m-%d %H:%M:%S')"

      - name: Run Fetch Cookie Script
        run: python fetch_cookie.py
        env:
          TZ: 'Asia/Dhaka'

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "🔄 Auto update - BDT: $(TZ='Asia/Dhaka' date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
