name: Premium 10-Min Cookie Fetcher

on:
  workflow_dispatch: 
  schedule:
    - cron: '*/10 * * * *' # প্রতি ১০ মিনিটে রান করবে

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Fetch Cookie Script
        run: python fetch_cookie.py
        
      # গিটহাবে সেভ করার কমান্ড (ফাইলটি সরাসরি গিটহাবেও আপডেট হবে)
      - name: Commit and Push Cookies
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add cookies.json
          git commit -m "Update cookies.json (Auto)" || exit 0
          git push
