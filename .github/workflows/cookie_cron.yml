name: Cookie Cron Worker

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Cookies per cycle'
        required: false
        default: '1'
      cycle:
        description: 'Cycle ID'
        required: false
        default: '1'

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-linux-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run fetch_cookie.py
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fetch_cookie.py

      - name: Chain next job
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/cookie_cron.yml/dispatches \
            -d '{"ref":"main","inputs":{"count":"1","cycle":"next"}}'
          echo "✅ Chained next cookie_cron job"
